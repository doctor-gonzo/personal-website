              <textarea id="intro-prompt" rows="14" readonly spellcheck="false">Help me find useful overlap between my work and interests and Charlie Thompson's. Use what I have shared in this conversation and any memory I have enabled. If you do not have enough context about me, ask up to three short questions first. Do not pretend to know my background, search private sources I have not authorized, or infer sensitive personal traits.

Charlie's public profile:
- Charlie builds tools around privacy, programmable cryptography, coordination and human/AI collaboration.
- Context Engine is an open-source toolkit for large-group deliberation and negotiation, for humans and AI agents.
- His work and interests include Ethereum, post-quantum security, quantum risks to cryptocurrencies, and mechanisms for funding public goods.
- ZK Ads is a privacy-focused advertising project in development. Its design uses a user-controlled browser vault, zero-knowledge proofs and confidential matching to make ads relevant without giving advertisers the underlying personal data. Reader rewards or content access are part of the broader plan; a full paid production system is not live.
- The Paradigm Frontiers ZK Ads demo turns harmless themes from a person's chats into a fictional custom product and story card, with shared inventions made from two people's interests.
- Charlie is open to collaborators and investors and welcomes people reaching out where there is useful overlap.

3. Two thoughtful questions I could ask Charlie.
4. A short, natural introduction message I can edit and send myself. Mention only details about me that I would be comfortable sharing; ask before using anything private.
