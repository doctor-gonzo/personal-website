  <body data-style-mode="minimal" data-demo-features="off">

          </ul>
        </details>
      </nav>
    </header>

    <main class="pictures-page">
      <div class="pictures-page-heading">
        <h1 class="pictures-page-intro">Pictures</h1>
        <div class="picture-filter-bar" role="group" aria-label="Filter pictures by collection">
          <button class="picture-filter-button is-active" type="button" aria-pressed="true" data-picture-filter="all">
            All
          </button>
          <button class="picture-filter-button" type="button" aria-pressed="false" data-picture-filter="ai">
            AI
          </button>
          <button class="picture-filter-button" type="button" aria-pressed="false" data-picture-filter="camera">
            Camera
          </button>
        </div>
      </div>

      <section
        class="picture-carousel"
        aria-label="Featured pictures"
        aria-roledescription="carousel"
        data-picture-carousel
        tabindex="0"
      >
        <div class="picture-carousel-stage">
          <button
            class="picture-carousel-control picture-carousel-previous"
            type="button"
            aria-label="Previous picture"
            data-picture-previous
          >
            <span aria-hidden="true">&lsaquo;</span>
          </button>

          <button
            class="picture-carousel-feature"
            type="button"
            aria-label="Open Chromatic profile"
            data-picture-open
          >
            <img
              class="picture-carousel-image"
              src="./assets/pictures/ai/midjourney-chromatic-profile.png"
              alt="Abstract translucent profile in pink, green, blue, and yellow."
              fetchpriority="high"
              data-picture-carousel-image
            >
          </button>

          <button
            class="picture-carousel-control picture-carousel-next"
            type="button"
            aria-label="Next picture"
            data-picture-next
          >
            <span aria-hidden="true">&rsaquo;</span>
          </button>
        </div>

        <div class="picture-carousel-toolbar">
          <strong class="picture-carousel-title" data-picture-carousel-title>Chromatic profile</strong>
          <p class="picture-carousel-status" aria-live="polite" aria-atomic="true">
            <span data-picture-carousel-position>1 / 6</span>
          </p>
        </div>

        <ol class="picture-carousel-thumbnails" aria-label="Choose a picture" data-picture-thumbnails>
          <li class="picture-carousel-thumbnail-loading">Loading gallery&hellip;</li>
        </ol>
      </section>

      <details class="picture-grid-browser">
        <summary>View As Grid</summary>
        <div class="picture-collection">
          <h2 data-picture-grid-title>All pictures</h2>
          <p data-picture-grid-description>AI-assisted images and photography.</p>
          <ul class="picture-list" id="picture-list">
            <li class="picture-empty">Loading pictures&hellip;</li>
          </ul>
        </div>
      </details>
    </main>

    <dialog class="picture-dialog" id="picture-dialog" aria-labelledby="picture-dialog-title">
      <form method="dialog">
        <button class="picture-dialog-close" type="submit">Close</button>
      </form>
      <img class="picture-dialog-image" id="picture-dialog-image" alt="">
      <h2 id="picture-dialog-title">Picture</h2>
      <p id="picture-dialog-details"></p>
    </dialog>
