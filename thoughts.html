    <main>
      <h1>Thoughts</h1>

      <div class="mode-checkpoint" role="tablist" aria-label="Choose a thoughts page">
        <button
          class="mode-checkpoint-button is-active"
          id="featured-tab"
          type="button"
          role="tab"
          aria-controls="featured-panel"
          aria-selected="true"
          data-thought-mode="featured"
        >
          Featured
        </button>
        <button
          class="mode-checkpoint-button"
          id="tweets-tab"
          type="button"
          role="tab"
          aria-controls="tweets-panel"
          aria-selected="false"
          tabindex="-1"
          data-thought-mode="tweets"
        >
          Tweets
        </button>
        <button
          class="mode-checkpoint-button"
          id="posts-tab"
          type="button"
          role="tab"
          aria-controls="posts-panel"
          aria-selected="false"
          tabindex="-1"
          data-thought-mode="posts"
        >
          Posts
        </button>
      </div>

      <section
        class="thought-collection featured-thoughts"
        id="featured-panel"
        role="tabpanel"
        aria-labelledby="featured-tab"
        data-thought-panel="featured"
      >
        <div class="featured-thoughts-grid">
          <section class="featured-thought">
            <h2>Featured tweet</h2>
            <ul
              class="tweet-list featured-tweet-list"
              data-featured-tweet-list
              data-featured-tweet-id="1777432908581531803"
            >
              <li>Loading featured tweet...</li>
            </ul>
          </section>

          <article class="featured-post">
            <a
              class="featured-post-image-link"
              href="https://contextengine.xyz/posts/agent-village-wrapped-2026"
              aria-label="Read Agent Village Wrapped 2026 on Context Engine"
            >
              <img
                class="featured-post-image"
                src="https://contextengine.sh/posts/agent-village-wrapped/attachments/header.jpg"
                alt="Two illustrated robots sit at an outdoor table reading papers."
                loading="lazy"
              >
            </a>
            <p class="featured-thought-label">Featured post</p>
            <h2>
              <a href="https://contextengine.xyz/posts/agent-village-wrapped-2026">
                Agent Village Wrapped 2026
              </a>
            </h2>
            <p>Read the full post on Context Engine.</p>
          </article>
        </div>
      </section>

      <section
        class="thought-collection"
        id="tweets-panel"
        role="tabpanel"
        aria-labelledby="tweets-tab"
        data-thought-panel="tweets"
        hidden
      >
        <details class="tweet-filter-disclosure">
          <summary>Filter</summary>
          <form class="tweet-filter" data-tweet-filter>
            <label>
              Search
              <input type="search" autocomplete="off" placeholder="Search tweets" data-tweet-search>
            </label>
            <label>
              Year
              <select data-tweet-year>
                <option value="">All years</option>
              </select>
            </label>
            <button type="button" data-tweet-clear>Clear</button>
            <output aria-live="polite" data-tweet-filter-count></output>
          </form>
        </details>

        <ul class="tweet-list" data-tweet-list data-src="./data/tweets/public-posts.json?v=featured-thoughts-1">
          <li>Loading tweets...</li>
        </ul>
      </section>

      <section
        class="thought-collection"
        id="posts-panel"
        role="tabpanel"
        aria-labelledby="posts-tab"
        data-thought-panel="posts"
        hidden
      >
        <ul>
          <li>
            <a href="https://contextengine.xyz/posts/agent-village-wrapped-2026">
              Agent Village Wrapped 2026
            </a>
          </li>
        </ul>
